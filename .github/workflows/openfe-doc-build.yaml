name: Test OpenFE Docs Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # nightly tests, 2 am
    - cron: "0 2 * * *"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -leo pipefail {0} 

jobs:
  test-openfe-docs-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout openfe
        uses: actions/checkout@v4
        with:
          repository: OpenFreeEnergy/openfe
          path: openfe

      - name: Checkout ExampleNotebooks repository
        uses: actions/checkout@v4
        with:
          path: openfe/docs/ExampleNotebooks

      - name: Get current date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "${GITHUB_OUTPUT}"
      
      - name: Install pixi doc environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          manifest-path: openfe/pixi.toml
          environments: docs
          locked: true
          cache: true

      - name: Build the docs
        working-directory: openfe
        run: pixi run -e docs docs-build
