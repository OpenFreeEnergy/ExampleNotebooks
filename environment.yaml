name: openfe-notebooks
channels:
  - conda-forge
dependencies:
  - coverage
  - ipywidgets
  - lxml
  - nbval
  - nglview
  - notebook
  - numpy
  - pip
  - pytest
  - pytest-cov
  - pytest-xdist
  - python
  - openfe==1.12.0
  - openff-interchange-base != 0.5.1  # https://github.com/openforcefield/openff-interchange/issues/1450
  - pip:
    - git+https://github.com/OpenFreeEnergy/konnektor@v0.5.0  # use conda-forge v0.5.0 after openfe conda-forge release
