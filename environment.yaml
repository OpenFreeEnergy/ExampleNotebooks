name: openfe-notebooks
channels:
  - conda-forge
dependencies:
  - coverage
  - ipywidgets
  - lxml
  - nbval
  - nglview <4  # https://github.com/nglviewer/nglview/issues/1181
  - notebook
  - numpy
  - pip
  - pytest
  - pytest-cov
  - pytest-xdist
  - python=3.13
  - openfe==1.13.*
  - cinnabar >=0.6.0
  - kartograf ~=2.0
  - konnektor ~=0.5.0
  - openfe-analysis>=0.5.0
  - lomap2>=3.2.1
  - setuptools <80  # needed by nglview

  - pip:
    - git+https://github.com/OpenFreeEnergy/openfe@main
